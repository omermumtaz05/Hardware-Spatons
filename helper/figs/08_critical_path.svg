<svg xmlns="http://www.w3.org/2000/svg" width="780" height="516" viewBox="0 0 780 516" role="img">
  <title>Critical path against the clock budget</title>
  <desc>Five chained floating-point operations totalling 241 nanoseconds drawn to scale beside the 20 nanosecond clock period they must fit inside.</desc>

  <style>
    .t   { font: 500 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .tr  { font: 400 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .ts  { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #6b6b6b; }
    .tsi { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .tm  { font: 400 12px 'SF Mono', Menlo, Consolas, monospace; fill: #6b6b6b; }
    .tmi { font: 400 12px 'SF Mono', Menlo, Consolas, monospace; fill: #1a1a1a; }
    .ttl { font: 500 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .arr { stroke: #6b6b6b; stroke-width: 1; fill: none; }
    .arrf{ stroke: #9a9a9a; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    .box { fill: #f6f6f4; stroke: #c4c4c4; stroke-width: 1; }
    .dash{ fill: none; stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 5 4; }
    .reg { stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

<text class="ttl" x="40" y="40" text-anchor="start">The critical path &#8212; 241 ns against a 20 ns budget</text>
<text class="tm" x="40" y="64" text-anchor="start">top_geo|dx_dd[16]  &#8594;  inter_line_buffer|mem|porta_datain_reg0</text>
<rect x="40" y="100" width="119.0375" height="54" rx="4" fill="#f8dcdc" stroke="#c47474" stroke-width="1"/>
<text class="t" x="99.51875" y="124.0" text-anchor="middle">fp32_sub</text>
<text class="ts" x="99.51875" y="142.0" text-anchor="middle">1 &#8722; dx</text>
<rect x="163.0375" y="100" width="119.0375" height="54" rx="4" fill="#f8dcdc" stroke="#c47474" stroke-width="1"/>
<text class="t" x="222.55624999999998" y="124.0" text-anchor="middle">fp32_mul</text>
<text class="ts" x="222.55624999999998" y="142.0" text-anchor="middle">weight</text>
<rect x="286.075" y="100" width="119.0375" height="54" rx="4" fill="#f8dcdc" stroke="#c47474" stroke-width="1"/>
<text class="t" x="345.59375" y="124.0" text-anchor="middle">fp32_mul</text>
<text class="ts" x="345.59375" y="142.0" text-anchor="middle">pixel</text>
<rect x="409.11249999999995" y="100" width="119.0375" height="54" rx="4" fill="#f8dcdc" stroke="#c47474" stroke-width="1"/>
<text class="t" x="468.63124999999997" y="124.0" text-anchor="middle">fp32_add</text>
<text class="ts" x="468.63124999999997" y="142.0" text-anchor="middle">pair sum</text>
<rect x="532.15" y="100" width="119.0375" height="54" rx="4" fill="#f8dcdc" stroke="#c47474" stroke-width="1"/>
<text class="t" x="591.6687499999999" y="124.0" text-anchor="middle">fp32_add</text>
<text class="ts" x="591.6687499999999" y="142.0" text-anchor="middle">final</text>
<line class="arr" x1="40" y1="170" x2="655.2180999999999" y2="170" marker-end="url(#a)"/>
<text class="tsi" x="347.60904999999997" y="190" text-anchor="middle">241.262 ns of combinational logic</text>
<rect x="40" y="220" width="51.0" height="30" rx="3" fill="#ddefdd" stroke="#67a367" stroke-width="1"/>
<text class="tsi" x="103.0" y="240" text-anchor="start">20 ns clock period (50 MHz constraint)</text>
<rect x="40" y="264" width="615.2180999999999" height="30" rx="3" fill="none" stroke="#c47474" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="tsi" x="48" y="284" text-anchor="start">actual &#8212; slack &#8722;221.4 ns, Fmax 4.14 MHz</text>
<text class="tsi" x="40" y="338" text-anchor="start">Each fp32 op is align-shift &#8594; add &#8594; leading-zero-detect &#8594; normalise &#8594; round:</text>
<text class="tsi" x="40" y="358" text-anchor="start">four sequential barrel shifters in soft logic, about 48 ns each. dx is worse than dy</text>
<text class="tsi" x="40" y="378" text-anchor="start">because dy only enters at the weight multiply, making its path four deep, not five.</text>
<rect x="40" y="400" width="700" height="76" rx="4" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="1"/>
<text class="t" x="56" y="424" text-anchor="start">The fix is nearly free.</text>
<text class="ts" x="56" y="444" text-anchor="start">II is 90 cycles and geo runs at 1 pixel/cycle, so geo is stalled 89 cycles in 90.</text>
<text class="ts" x="56" y="462" text-anchor="start">N pipeline stages cost N cycles against 5,898,240 per frame &#8212; and zero throughput.</text>

</svg>
