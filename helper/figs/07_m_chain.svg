<svg xmlns="http://www.w3.org/2000/svg" width="840" height="528" viewBox="0 0 840 528" role="img">
  <title>Collapse of the layer scale chain</title>
  <desc>Side by side comparison of the old runtime scalar chain with two multipliers and a normaliser against the new constant-and-shift form.</desc>

  <style>
    .t   { font: 500 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .tr  { font: 400 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .ts  { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #6b6b6b; }
    .tsi { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .tm  { font: 400 12px 'SF Mono', Menlo, Consolas, monospace; fill: #6b6b6b; }
    .tmi { font: 400 12px 'SF Mono', Menlo, Consolas, monospace; fill: #1a1a1a; }
    .ttl { font: 500 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .arr { stroke: #6b6b6b; stroke-width: 1; fill: none; }
    .arrf{ stroke: #9a9a9a; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    .box { fill: #f6f6f4; stroke: #c4c4c4; stroke-width: 1; }
    .dash{ fill: none; stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 5 4; }
    .reg { stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

<text class="ttl" x="40" y="40" text-anchor="start">Why the DSP budget closed &#8212; the M chain collapses</text>
<text class="t" x="40" y="72" text-anchor="start">before &#8212; runtime scalar M</text>
<text class="t" x="490" y="72" text-anchor="start">after &#8212; constant and a shift</text>
<line class="reg" x1="466" y1="60" x2="466" y2="352"/>
<rect x="40" y="92" width="250" height="38" rx="4" fill="#f8dcdc" stroke="#c47474" stroke-width="1"/>
<text class="t" x="165.0" y="116.0" text-anchor="middle">maxacc &#215; X</text>
<text class="ts" x="300" y="116" text-anchor="start">32&#215;32 multiply</text>
<line class="arr" x1="165" y1="130" x2="165" y2="140" marker-end="url(#a)"/>
<rect x="40" y="144" width="250" height="38" rx="4" fill="#f8dcdc" stroke="#c47474" stroke-width="1"/>
<text class="t" x="165.0" y="168.0" text-anchor="middle">normalise(G, 24b)</text>
<text class="ts" x="300" y="168" text-anchor="start">priority encoder</text>
<line class="arr" x1="165" y1="182" x2="165" y2="192" marker-end="url(#a)"/>
<rect x="40" y="196" width="250" height="38" rx="4" fill="#f8dcdc" stroke="#c47474" stroke-width="1"/>
<text class="t" x="165.0" y="220.0" text-anchor="middle">gmant &#215; K_MANT</text>
<text class="ts" x="300" y="220" text-anchor="start">24&#215;18 multiply</text>
<line class="arr" x1="165" y1="234" x2="165" y2="244" marker-end="url(#a)"/>
<rect x="40" y="248" width="250" height="38" rx="4" fill="#f8e7cd" stroke="#c9944a" stroke-width="1"/>
<text class="t" x="165.0" y="272.0" text-anchor="middle">m_fx &#187; (K &#8722; gexp)</text>
<text class="ts" x="300" y="272" text-anchor="start">barrel shift</text>
<line class="arr" x1="165" y1="286" x2="165" y2="296" marker-end="url(#a)"/>
<rect x="40" y="300" width="250" height="38" rx="4" fill="#f8e7cd" stroke="#c9944a" stroke-width="1"/>
<text class="t" x="165.0" y="324.0" text-anchor="middle">(racc &#215; m_fx) &#187; MSH</text>
<text class="ts" x="300" y="324" text-anchor="start">+ bias</text>
<rect x="490" y="92" width="300" height="38" rx="4" fill="#ddefdd" stroke="#67a367" stroke-width="1"/>
<text class="t" x="640.0" y="116.0" text-anchor="middle">s_in, s_acc are exponents</text>
<text class="ts" x="492" y="146" text-anchor="start">requant normalises by 2&#8319;</text>
<line class="arr" x1="640" y1="152" x2="640" y2="160" marker-end="url(#a)"/>
<rect x="490" y="168" width="300" height="38" rx="4" fill="#ddefdd" stroke="#67a367" stroke-width="1"/>
<text class="t" x="640.0" y="192.0" text-anchor="middle">msh = K_SHIFT &#8722; s_in &#8722; s_acc</text>
<text class="ts" x="492" y="222" text-anchor="start">one subtract, registered</text>
<line class="arr" x1="640" y1="228" x2="640" y2="236" marker-end="url(#a)"/>
<rect x="490" y="244" width="300" height="38" rx="4" fill="#ddefdd" stroke="#67a367" stroke-width="1"/>
<text class="t" x="640.0" y="268.0" text-anchor="middle">(racc &#215; K_MANT) &#187; msh</text>
<text class="ts" x="492" y="298" text-anchor="start">constant multiply, in ALMs</text>
<rect x="40" y="368" width="750" height="76" rx="4" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="1"/>
<text class="tmi" x="56" y="394" text-anchor="start">M = 2^(s_in + s_acc) &#215; K_MANT / 2^K_SHIFT</text>
<text class="ts" x="56" y="418" text-anchor="start">Both multiplies, the normaliser and the m_fx register are deleted. For layer 1 and the</text>
<text class="ts" x="56" y="434" text-anchor="start">residual K_MANT is a power of two, so the multiply collapses to a wire.</text>
<text class="tsi" x="40" y="476" text-anchor="start">DSP blocks: 146 reported &#8594; ~51 after. Initiation interval: 151 &#8594; 90 cycles per pixel.</text>
<text class="ts" x="40" y="498" text-anchor="start">Enabled by one change &#8212; requant_int normalising by a power of two, not the exact abs-max.</text>

</svg>
