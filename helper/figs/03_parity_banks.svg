<text class="tsi" x="218" y="318" text-anchor="middle">one bilinear quad</text>
<rect x="330" y="96" width="150" height="46" rx="4" fill="#dce7f5" stroke="#5f88c0" stroke-width="1"/>
<text class="t" x="405.0" y="116.0" text-anchor="middle">ROM_EE</text>
<text class="ts" x="405.0" y="134.0" text-anchor="middle">128 &#215; 128 &#215; 24b</text>
<rect x="330" y="156" width="150" height="46" rx="4" fill="#d5ecea" stroke="#4e9d98" stroke-width="1"/>
<text class="t" x="405.0" y="176.0" text-anchor="middle">ROM_EO</text>
<text class="ts" x="405.0" y="194.0" text-anchor="middle">128 &#215; 128 &#215; 24b</text>
<rect x="330" y="216" width="150" height="46" rx="4" fill="#f8e7cd" stroke="#c9944a" stroke-width="1"/>
<text class="t" x="405.0" y="236.0" text-anchor="middle">ROM_OE</text>
<text class="ts" x="405.0" y="254.0" text-anchor="middle">128 &#215; 128 &#215; 24b</text>
<rect x="330" y="276" width="150" height="46" rx="4" fill="#ddefdd" stroke="#67a367" stroke-width="1"/>
<text class="t" x="405.0" y="296.0" text-anchor="middle">ROM_OO</text>
<text class="ts" x="405.0" y="314.0" text-anchor="middle">128 &#215; 128 &#215; 24b</text>
<path class="arr" d="M252 170 H268 V119 H324" marker-end="url(#a)"/>
<path class="arr" d="M252 184 H284 V179 H324" marker-end="url(#a)"/>
<path class="arr" d="M252 204 H300 V239 H324" marker-end="url(#a)"/>
<path class="arr" d="M252 218 H316 V299 H324" marker-end="url(#a)"/>
<rect x="530" y="156" width="180" height="106" rx="4" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="1"/>
<text class="t" x="620.0" y="214.0" text-anchor="middle"></text>
<text class="t" x="620" y="186" text-anchor="middle">output crossbar</text>
<text class="ts" x="620" y="208" text-anchor="middle">registered parity</text>
<text class="ts" x="620" y="226" text-anchor="middle">routes each bank back</text>
<text class="ts" x="620" y="244" text-anchor="middle">to its corner</text>
<line class="arr" x1="480" y1="119" x2="526" y2="200" marker-end="url(#a)"/>
<line class="arr" x1="480" y1="179" x2="526" y2="200" marker-end="url(#a)"/>
<line class="arr" x1="480" y1="239" x2="526" y2="200" marker-end="url(#a)"/>
<line class="arr" x1="480" y1="299" x2="526" y2="200" marker-end="url(#a)"/>
<text class="tsi" x="40" y="366" text-anchor="start">A bilinear quad is (x,y), (x+1,y), (x,y+1), (x+1,y+1) &#8212; so the four corners</text>
<text class="tsi" x="40" y="386" text-anchor="start">always carry four distinct parities. Exactly one lands in each bank, all four</text>
<text class="tsi" x="40" y="406" text-anchor="start">read in parallel, and total storage is unchanged. No replication.</text>

</svg>
