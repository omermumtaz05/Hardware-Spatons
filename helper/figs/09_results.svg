<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540" role="img">
  <title>Fitted results on the Cyclone V A7</title>
  <desc>Resource utilisation bars, a waterfall showing DSP blocks removed by the requantisation rewrite, and frame rate as a function of achievable clock.</desc>

  <style>
    .t   { font: 500 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .tr  { font: 400 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .ts  { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #6b6b6b; }
    .tsi { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .tm  { font: 400 12px 'SF Mono', Menlo, Consolas, monospace; fill: #6b6b6b; }
    .tmi { font: 400 12px 'SF Mono', Menlo, Consolas, monospace; fill: #1a1a1a; }
    .ttl { font: 500 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .arr { stroke: #6b6b6b; stroke-width: 1; fill: none; }
    .arrf{ stroke: #9a9a9a; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    .box { fill: #f6f6f4; stroke: #c4c4c4; stroke-width: 1; }
    .dash{ fill: none; stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 5 4; }
    .reg { stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

<text class="ttl" x="40" y="40" text-anchor="start">Results &#8212; 5CEFA7F31I7, fitted</text>
<text class="t" x="40" y="76" text-anchor="start">Utilisation</text>
<text class="ts" x="40" y="110" text-anchor="start">ALMs</text>
<rect x="140" y="96" width="260" height="18" rx="3" fill="#ffffff" stroke="#c4c4c4" stroke-width="1"/>
<rect x="140" y="96" width="174.4" height="18" rx="3" fill="#dce7f5" stroke="#5f88c0" stroke-width="1"/>
<text class="tsi" x="410" y="110" text-anchor="start">67%</text>
<text class="ts" x="40" y="144" text-anchor="start">RAM blocks</text>
<rect x="140" y="130" width="260" height="18" rx="3" fill="#ffffff" stroke="#c4c4c4" stroke-width="1"/>
<rect x="140" y="130" width="197.1" height="18" rx="3" fill="#f8e7cd" stroke="#c9944a" stroke-width="1"/>
<text class="tsi" x="410" y="144" text-anchor="start">76%</text>
<text class="ts" x="40" y="178" text-anchor="start">Memory bits</text>
<rect x="140" y="164" width="260" height="18" rx="3" fill="#ffffff" stroke="#c4c4c4" stroke-width="1"/>
<rect x="140" y="164" width="154.1" height="18" rx="3" fill="#dce7f5" stroke="#5f88c0" stroke-width="1"/>
<text class="tsi" x="410" y="178" text-anchor="start">59%</text>
<text class="ts" x="40" y="212" text-anchor="start">DSP</text>
<rect x="140" y="198" width="260" height="18" rx="3" fill="#ffffff" stroke="#c4c4c4" stroke-width="1"/>
<rect x="140" y="198" width="211.7" height="18" rx="3" fill="#f8e7cd" stroke="#c9944a" stroke-width="1"/>
<text class="tsi" x="410" y="212" text-anchor="start">81%</text>
<text class="ts" x="40" y="246" text-anchor="start">Pins</text>
<rect x="140" y="232" width="260" height="18" rx="3" fill="#ffffff" stroke="#c4c4c4" stroke-width="1"/>
<rect x="140" y="232" width="54.7" height="18" rx="3" fill="#dce7f5" stroke="#5f88c0" stroke-width="1"/>
<text class="tsi" x="410" y="246" text-anchor="start">21%</text>
<text class="t" x="470" y="76" text-anchor="start">DSP blocks in the MLP</text>
<text class="ts" x="470" y="110" text-anchor="start">reported</text>
<rect x="540" y="96" width="160.6" height="18" rx="3" fill="#f8dcdc" stroke="#c47474" stroke-width="1"/>
<text class="tsi" x="692.6" y="110" text-anchor="end">146</text>
<text class="ts" x="470" y="144" text-anchor="start">after</text>
<rect x="540" y="130" width="56.1" height="18" rx="3" fill="#ddefdd" stroke="#67a367" stroke-width="1"/>
<text class="tsi" x="588.1" y="144" text-anchor="end">51</text>
<line x1="635.7" y1="88" x2="635.7" y2="176" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts" x="635.7" y="190" text-anchor="middle">DE1-SoC 87</text>
<line x1="711.6" y1="88" x2="711.6" y2="176" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts" x="711.6" y="190" text-anchor="middle">A7 156</text>
<text class="t" x="470" y="214" text-anchor="start">what came out</text>
<text class="ts" x="470" y="236" text-anchor="start">requant reciprocal</text>
<text class="tsi" x="700" y="236" text-anchor="end">&#8722;20</text>
<text class="ts" x="470" y="256" text-anchor="start">layer 32&#215;32</text>
<text class="tsi" x="700" y="256" text-anchor="end">&#8722;24</text>
<text class="ts" x="470" y="276" text-anchor="start">layer 24&#215;18</text>
<text class="tsi" x="700" y="276" text-anchor="end">&#8722;4</text>
<text class="ts" x="470" y="296" text-anchor="start">apply &#8594; ALMs</text>
<text class="tsi" x="700" y="296" text-anchor="end">&#8722;16</text>
<line x1="470" y1="304" x2="700" y2="304" stroke="#c4c4c4" stroke-width="1"/>
<text class="tsi" x="470" y="320" text-anchor="start">total removed</text>
<text class="tsi" x="700" y="320" text-anchor="end">&#8722;64</text>
<text class="t" x="40" y="310" text-anchor="start">Frame rate is Fmax-bound, not II-bound</text>
<text class="ts" x="40" y="344" text-anchor="start">4.14 MHz  (today)</text>
<rect x="200" y="330" width="15.4" height="18" rx="3" fill="#f8dcdc" stroke="#c47474" stroke-width="1"/>
<text class="tsi" x="223.4" y="344" text-anchor="start">0.7 fps</text>
<text class="ts" x="40" y="374" text-anchor="start">20 MHz  (pipelined)</text>
<rect x="200" y="360" width="74.8" height="18" rx="3" fill="#f8e7cd" stroke="#c9944a" stroke-width="1"/>
<text class="tsi" x="282.8" y="374" text-anchor="start">3.4 fps</text>
<text class="ts" x="40" y="404" text-anchor="start">50 MHz</text>
<rect x="200" y="390" width="187.0" height="18" rx="3" fill="#dce7f5" stroke="#5f88c0" stroke-width="1"/>
<text class="tsi" x="395.0" y="404" text-anchor="start">8.5 fps</text>
<text class="ts" x="40" y="434" text-anchor="start">100 MHz</text>
<rect x="200" y="420" width="374.0" height="18" rx="3" fill="#ddefdd" stroke="#67a367" stroke-width="1"/>
<text class="tsi" x="582.0" y="434" text-anchor="start">17.0 fps</text>
<text class="ts" x="40" y="470" text-anchor="start">FPS = f_clk / (65536 &#215; 90). II = 90 is a property of layer 2, not of the device.</text>
<text class="ts" x="40" y="490" text-anchor="start">Past 17 fps the only lever left is NUM_FOLDS on layer 2 &#8212; affordable on the A7 in a way</text>
<text class="ts" x="40" y="508" text-anchor="start">it was not on the DE1-SoC.</text>

</svg>
