<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img">
  <title>top_full system dataflow</title>
  <desc>Five blocks in a vertical chain with a per-line stall feedback path and the one-pixel-per-cycle versus one-per-ninety-cycles rate mismatch.</desc>

  <style>
    .t   { font: 500 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .tr  { font: 400 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .ts  { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #6b6b6b; }
    .tsi { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .tm  { font: 400 12px 'SF Mono', Menlo, Consolas, monospace; fill: #6b6b6b; }
    .tmi { font: 400 12px 'SF Mono', Menlo, Consolas, monospace; fill: #1a1a1a; }
    .ttl { font: 500 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .arr { stroke: #6b6b6b; stroke-width: 1; fill: none; }
    .arrf{ stroke: #9a9a9a; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    .box { fill: #f6f6f4; stroke: #c4c4c4; stroke-width: 1; }
    .dash{ fill: none; stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 5 4; }
    .reg { stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

<text class="ttl" x="40" y="40" text-anchor="start">top_full &#8212; system dataflow</text>
<rect x="220" y="64" width="280" height="56" rx="4" fill="#dce7f5" stroke="#5f88c0" stroke-width="1"/>
<text class="t" x="360.0" y="89.0" text-anchor="middle">top_geo</text>
<text class="ts" x="360.0" y="107.0" text-anchor="middle">1 pixel per cycle, stallable</text>
<rect x="220" y="154" width="280" height="56" rx="4" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="1"/>
<text class="t" x="360.0" y="179.0" text-anchor="middle">inter_line_buffer</text>
<text class="ts" x="360.0" y="197.0" text-anchor="middle">4 lines, 3-line window</text>
<rect x="220" y="244" width="280" height="56" rx="4" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="1"/>
<text class="t" x="360.0" y="269.0" text-anchor="middle">patch_extractor</text>
<text class="ts" x="360.0" y="287.0" text-anchor="middle">3&#215;3 window &#8594; 29 features</text>
<rect x="220" y="334" width="280" height="56" rx="4" fill="#d5ecea" stroke="#4e9d98" stroke-width="1"/>
<text class="t" x="360.0" y="359.0" text-anchor="middle">photo_stage_int</text>
<text class="ts" x="360.0" y="377.0" text-anchor="middle">A12 MLP, 90 cycles per pixel</text>
<rect x="220" y="424" width="280" height="56" rx="4" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="1"/>
<text class="t" x="360.0" y="449.0" text-anchor="middle">output_buffer</text>
<text class="ts" x="360.0" y="467.0" text-anchor="middle">final RGB at y&#183;W + x</text>
<line class="arr" x1="360" y1="120" x2="360" y2="150" marker-end="url(#a)"/>
<line class="arr" x1="360" y1="210" x2="360" y2="240" marker-end="url(#a)"/>
<line class="arr" x1="360" y1="300" x2="360" y2="330" marker-end="url(#a)"/>
<line class="arr" x1="360" y1="390" x2="360" y2="420" marker-end="url(#a)"/>
<path class="arr" d="M220 182 H160 V92 H216" marker-end="url(#a)"/>
<text class="ts" x="150" y="141" text-anchor="end">stall, per line</text>
<text class="tsi" x="520" y="141" text-anchor="start">1 pixel / cycle</text>
<text class="tsi" x="520" y="315" text-anchor="start">1 pixel / 90 cycles</text>
<text class="ts" x="520" y="333" text-anchor="start">this gap is why the</text>
<text class="ts" x="520" y="349" text-anchor="start">buffer exists</text>
<rect x="220" y="498" width="12" height="12" rx="2" fill="#dce7f5" stroke="#5f88c0" stroke-width="1"/>
<text class="ts" x="238" y="508" text-anchor="start">geometric stage</text>
<rect x="390" y="498" width="12" height="12" rx="2" fill="#d5ecea" stroke="#4e9d98" stroke-width="1"/>
<text class="ts" x="408" y="508" text-anchor="start">photometric stage</text>

</svg>
