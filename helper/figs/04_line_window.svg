<svg xmlns="http://www.w3.org/2000/svg" width="810" height="414" viewBox="0 0 810 414" role="img">
  <title>Inter-line buffer and patch extractor</title>
  <desc>Four line slots with a three-line sliding window, and the nine-step raster read sequence that builds the three-by-three neighbourhood.</desc>

  <style>
    .t   { font: 500 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .tr  { font: 400 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .ts  { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #6b6b6b; }
    .tsi { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .tm  { font: 400 12px 'SF Mono', Menlo, Consolas, monospace; fill: #6b6b6b; }
    .tmi { font: 400 12px 'SF Mono', Menlo, Consolas, monospace; fill: #1a1a1a; }
    .ttl { font: 500 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .arr { stroke: #6b6b6b; stroke-width: 1; fill: none; }
    .arrf{ stroke: #9a9a9a; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    .box { fill: #f6f6f4; stroke: #c4c4c4; stroke-width: 1; }
    .dash{ fill: none; stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 5 4; }
    .reg { stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

<text class="ttl" x="40" y="40" text-anchor="start">Inter-line buffer &#8212; circular, counted in lines</text>
<rect x="40" y="80" width="260" height="40" rx="4" fill="#d5ecea" stroke="#4e9d98" stroke-width="1"/>
<text class="t" x="170.0" y="105.0" text-anchor="middle">line slot 0</text>
<rect x="40" y="130" width="260" height="40" rx="4" fill="#d5ecea" stroke="#4e9d98" stroke-width="1"/>
<text class="t" x="170.0" y="155.0" text-anchor="middle">line slot 1</text>
<rect x="40" y="180" width="260" height="40" rx="4" fill="#d5ecea" stroke="#4e9d98" stroke-width="1"/>
<text class="t" x="170.0" y="205.0" text-anchor="middle">line slot 2</text>
<rect x="40" y="230" width="260" height="40" rx="4" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="1"/>
<text class="t" x="170.0" y="247.0" text-anchor="middle">line slot 3</text>
<text class="ts" x="170.0" y="265.0" text-anchor="middle">spare &#8212; lets geo write ahead</text>
<rect x="28" y="68" width="284" height="152" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 4" rx="6"/>
<text class="tsi" x="28" y="300" text-anchor="start">WINDOW = 3 live lines; rd_line_sel picks one of them</text>
<path class="arr" d="M300 96 H460" marker-end="url(#a)"/>
<text class="tm" x="320" y="88" text-anchor="start">wr_line_valid</text>
<path class="arr" d="M460 250 H306" marker-end="url(#a)"/>
<text class="tm" x="320" y="242" text-anchor="start">rd_line_consume</text>
<rect x="470" y="76" width="300" height="190" rx="4" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="1"/>
<text class="t" x="620.0" y="176.0" text-anchor="middle"></text>
<text class="t" x="620" y="102" text-anchor="middle">patch_extractor</text>
<text class="ts" x="620" y="120" text-anchor="middle">9 reads, one per cycle</text>
<rect x="572" y="134" width="32" height="32" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="0.75"/>
<text class="ts" x="588.0" y="154.0" text-anchor="middle">0</text>
<rect x="604" y="134" width="32" height="32" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="0.75"/>
<text class="ts" x="620.0" y="154.0" text-anchor="middle">1</text>
<rect x="636" y="134" width="32" height="32" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="0.75"/>
<text class="ts" x="652.0" y="154.0" text-anchor="middle">2</text>
<rect x="572" y="166" width="32" height="32" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="0.75"/>
<text class="ts" x="588.0" y="186.0" text-anchor="middle">3</text>
<rect x="604" y="166" width="32" height="32" fill="#dce7f5" stroke="#5f88c0" stroke-width="0.75"/>
<text class="ts" x="620.0" y="186.0" text-anchor="middle">4</text>
<rect x="636" y="166" width="32" height="32" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="0.75"/>
<text class="ts" x="652.0" y="186.0" text-anchor="middle">5</text>
<rect x="572" y="198" width="32" height="32" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="0.75"/>
<text class="ts" x="588.0" y="218.0" text-anchor="middle">6</text>
<rect x="604" y="198" width="32" height="32" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="0.75"/>
<text class="ts" x="620.0" y="218.0" text-anchor="middle">7</text>
<rect x="636" y="198" width="32" height="32" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="0.75"/>
<text class="ts" x="652.0" y="218.0" text-anchor="middle">8</text>
<text class="ts" x="620" y="254" text-anchor="middle">centre &#8594; f[2..4], tapped by the side FIFO</text>
<text class="tsi" x="40" y="340" text-anchor="start">Edges reflect without repeating: column &#8722;1 maps to 1, column W maps to W&#8722;2.</text>
<text class="tsi" x="40" y="360" text-anchor="start">First and last row need only 2 committed lines, so the extractor cannot deadlock</text>
<text class="tsi" x="40" y="380" text-anchor="start">waiting for a line that will never arrive.</text>

</svg>
