<svg xmlns="http://www.w3.org/2000/svg" width="900" height="456" viewBox="0 0 900 456" role="img">
  <title>A12 MLP topology and pipelining</title>
  <desc>Main path of three layers alongside a linear residual branch buffered in a FIFO, recombined in three registered stages and passed to the post-MLP chain.</desc>

  <style>
    .t   { font: 500 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .tr  { font: 400 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .ts  { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #6b6b6b; }
    .tsi { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .tm  { font: 400 12px 'SF Mono', Menlo, Consolas, monospace; fill: #6b6b6b; }
    .tmi { font: 400 12px 'SF Mono', Menlo, Consolas, monospace; fill: #1a1a1a; }
    .ttl { font: 500 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .arr { stroke: #6b6b6b; stroke-width: 1; fill: none; }
    .arrf{ stroke: #9a9a9a; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    .box { fill: #f6f6f4; stroke: #c4c4c4; stroke-width: 1; }
    .dash{ fill: none; stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 5 4; }
    .reg { stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

<text class="ttl" x="40" y="40" text-anchor="start">Photometric stage &#8212; A12 MLP with residual branch</text>
<rect x="40" y="92" width="110" height="50" rx="4" fill="#dce7f5" stroke="#5f88c0" stroke-width="1"/>
<text class="t" x="95.0" y="114.0" text-anchor="middle">f[29]</text>
<text class="ts" x="95.0" y="132.0" text-anchor="middle">features</text>
<rect x="200" y="74" width="120" height="44" rx="4" fill="#d5ecea" stroke="#4e9d98" stroke-width="1"/>
<text class="t" x="260.0" y="93.0" text-anchor="middle">layer 1</text>
<text class="ts" x="260.0" y="111.0" text-anchor="middle">29&#8594;48 ReLU</text>
<rect x="340" y="74" width="120" height="44" rx="4" fill="#d5ecea" stroke="#4e9d98" stroke-width="1"/>
<text class="t" x="400.0" y="93.0" text-anchor="middle">layer 2</text>
<text class="ts" x="400.0" y="111.0" text-anchor="middle">48&#8594;48 ReLU</text>
<rect x="480" y="74" width="120" height="44" rx="4" fill="#d5ecea" stroke="#4e9d98" stroke-width="1"/>
<text class="t" x="540.0" y="93.0" text-anchor="middle">layer 3</text>
<text class="ts" x="540.0" y="111.0" text-anchor="middle">48&#8594;3 linear</text>
<text class="ts" x="400" y="62" text-anchor="middle">89 of the 90-cycle II lives here</text>
<rect x="200" y="160" width="120" height="44" rx="4" fill="#f8e7cd" stroke="#c9944a" stroke-width="1"/>
<text class="t" x="260.0" y="179.0" text-anchor="middle">residual</text>
<text class="ts" x="260.0" y="197.0" text-anchor="middle">29&#8594;3 linear</text>
<rect x="360" y="160" width="120" height="44" rx="4" fill="#f8e7cd" stroke="#c9944a" stroke-width="1"/>
<text class="t" x="420.0" y="179.0" text-anchor="middle">fifo_residual</text>
<text class="ts" x="420.0" y="197.0" text-anchor="middle">depth 4, FWFT</text>
<line class="arr" x1="150" y1="108" x2="196" y2="100" marker-end="url(#a)"/>
<path class="arr" d="M95 142 V182 H196" marker-end="url(#a)"/>
<line class="arr" x1="320" y1="96" x2="336" y2="96" marker-end="url(#a)"/>
<line class="arr" x1="460" y1="96" x2="476" y2="96" marker-end="url(#a)"/>
<line class="arr" x1="320" y1="182" x2="356" y2="182" marker-end="url(#a)"/>
<rect x="640" y="110" width="150" height="80" rx="4" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="1"/>
<text class="t" x="715.0" y="155.0" text-anchor="middle"></text>
<text class="t" x="715" y="134" text-anchor="middle">combine</text>
<text class="tm" x="715" y="154" text-anchor="middle">1  integer add</text>
<text class="tm" x="715" y="170" text-anchor="middle">2  int &#8594; fp32</text>
<text class="tm" x="715" y="186" text-anchor="middle">3  &#215; lambda3</text>
<path class="arr" d="M600 96 H620 V140 H636" marker-end="url(#a)"/>
<path class="arr" d="M480 182 H620 V160 H636" marker-end="url(#a)"/>
<rect x="640" y="240" width="150" height="44" rx="4" fill="#f8dcdc" stroke="#c47474" stroke-width="1"/>
<text class="t" x="715.0" y="259.0" text-anchor="middle">post_mlp</text>
<text class="ts" x="715.0" y="277.0" text-anchor="middle">4&#963;(z)&#8722;2, clamp</text>
<line class="arr" x1="715" y1="190" x2="715" y2="236" marker-end="url(#a)"/>
<rect x="400" y="240" width="190" height="44" rx="4" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="1"/>
<text class="t" x="495.0" y="259.0" text-anchor="middle">side FIFO</text>
<text class="ts" x="495.0" y="277.0" text-anchor="middle">centre RGB = f[2..4]</text>
<path class="arr" d="M95 142 V262 H396" marker-end="url(#a)"/>
<line class="arr" x1="590" y1="262" x2="636" y2="262" marker-end="url(#a)"/>
<line class="arr" x1="790" y1="262" x2="830" y2="262" marker-end="url(#a)"/>
<text class="tmi" x="834" y="266" text-anchor="start">final_rgb</text>
<text class="tsi" x="40" y="330" text-anchor="start">L1 and residual accept each pixel together, since they share f. The residual does not</text>
<text class="tsi" x="40" y="350" text-anchor="start">hold until L3 &#8212; it pushes into the FIFO and frees itself, so the input side can take</text>
<text class="tsi" x="40" y="370" text-anchor="start">pixel N+1 while N&#8722;2 &#8230; N are still in flight. In-order path + FIFO order means y and</text>
<text class="tsi" x="40" y="390" text-anchor="start">y_r are always the same pixel.</text>
<rect x="40" y="414" width="12" height="12" rx="2" fill="#d5ecea" stroke="#4e9d98" stroke-width="1"/>
<text class="ts" x="58" y="424" text-anchor="start">main path</text>
<rect x="210" y="414" width="12" height="12" rx="2" fill="#f8e7cd" stroke="#c9944a" stroke-width="1"/>
<text class="ts" x="228" y="424" text-anchor="start">residual</text>
<rect x="380" y="414" width="12" height="12" rx="2" fill="#f8dcdc" stroke="#c47474" stroke-width="1"/>
<text class="ts" x="398" y="424" text-anchor="start">combinational</text>

</svg>
