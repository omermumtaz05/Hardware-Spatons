<svg xmlns="http://www.w3.org/2000/svg" width="900" height="306" viewBox="0 0 900 306" role="img">
  <title>layer_int finite state machine</title>
  <desc>Seven states from ACCEPT through HOLD with per-state cycle costs, showing the neuron MAC sweep dominating the layer latency.</desc>

  <style>
    .t   { font: 500 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .tr  { font: 400 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .ts  { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #6b6b6b; }
    .tsi { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .tm  { font: 400 12px 'SF Mono', Menlo, Consolas, monospace; fill: #6b6b6b; }
    .tmi { font: 400 12px 'SF Mono', Menlo, Consolas, monospace; fill: #1a1a1a; }
    .ttl { font: 500 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .arr { stroke: #6b6b6b; stroke-width: 1; fill: none; }
    .arrf{ stroke: #9a9a9a; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    .box { fill: #f6f6f4; stroke: #c4c4c4; stroke-width: 1; }
    .dash{ fill: none; stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 5 4; }
    .reg { stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

<text class="ttl" x="40" y="40" text-anchor="start">layer_int &#8212; FSM and where the cycles go</text>
<rect x="40" y="84" width="112" height="52" rx="4" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="1"/>
<text class="t" x="96.0" y="107.0" text-anchor="middle">ACCEPT</text>
<text class="ts" x="96.0" y="125.0" text-anchor="middle">latch input</text>
<text class="ts" x="96.0" y="152" text-anchor="middle">1 cyc</text>
<line class="arr" x1="152" y1="110" x2="164" y2="110" marker-end="url(#a)"/>
<rect x="164" y="84" width="112" height="52" rx="4" fill="#dce7f5" stroke="#5f88c0" stroke-width="1"/>
<text class="t" x="220.0" y="107.0" text-anchor="middle">RQ_IN</text>
<text class="ts" x="220.0" y="125.0" text-anchor="middle">requant scan 1</text>
<text class="ts" x="220.0" y="152" text-anchor="middle">14 cyc</text>
<line class="arr" x1="276" y1="110" x2="288" y2="110" marker-end="url(#a)"/>
<rect x="288" y="84" width="112" height="52" rx="4" fill="#d5ecea" stroke="#4e9d98" stroke-width="1"/>
<text class="t" x="344.0" y="107.0" text-anchor="middle">COMPUTE</text>
<text class="ts" x="344.0" y="125.0" text-anchor="middle">neuron MACs</text>
<text class="ts" x="344.0" y="152" text-anchor="middle">50 cyc</text>
<line class="arr" x1="400" y1="110" x2="412" y2="110" marker-end="url(#a)"/>
<rect x="412" y="84" width="112" height="52" rx="4" fill="#dce7f5" stroke="#5f88c0" stroke-width="1"/>
<text class="t" x="468.0" y="107.0" text-anchor="middle">RQ_ACC</text>
<text class="ts" x="468.0" y="125.0" text-anchor="middle">requant scan 2</text>
<text class="ts" x="468.0" y="152" text-anchor="middle">14 cyc</text>
<line class="arr" x1="524" y1="110" x2="536" y2="110" marker-end="url(#a)"/>
<rect x="536" y="84" width="112" height="52" rx="4" fill="#f8e7cd" stroke="#c9944a" stroke-width="1"/>
<text class="t" x="592.0" y="107.0" text-anchor="middle">SCALE</text>
<text class="ts" x="592.0" y="125.0" text-anchor="middle">msh = K&#8722;s&#8331;&#8722;s&#8336;</text>
<text class="ts" x="592.0" y="152" text-anchor="middle">1 cyc</text>
<line class="arr" x1="648" y1="110" x2="660" y2="110" marker-end="url(#a)"/>
<rect x="660" y="84" width="112" height="52" rx="4" fill="#f8e7cd" stroke="#c9944a" stroke-width="1"/>
<text class="t" x="716.0" y="107.0" text-anchor="middle">APPLY</text>
<text class="ts" x="716.0" y="125.0" text-anchor="middle">&#215;K, +B, ReLU</text>
<text class="ts" x="716.0" y="152" text-anchor="middle">6 cyc</text>
<line class="arr" x1="772" y1="110" x2="784" y2="110" marker-end="url(#a)"/>
<rect x="784" y="84" width="112" height="52" rx="4" fill="#f6f6f4" stroke="#c4c4c4" stroke-width="1"/>
<text class="t" x="840.0" y="107.0" text-anchor="middle">HOLD</text>
<text class="ts" x="840.0" y="125.0" text-anchor="middle">await out_ready</text>
<text class="ts" x="840.0" y="152" text-anchor="middle">1 cyc</text>
<path class="arrf" d="M886 136 V172 H46 V142" marker-end="url(#a)"/>
<text class="ts" x="460" y="188" text-anchor="middle">out_ready &#8594; next pixel</text>
<text class="tsi" x="40" y="234" text-anchor="start">One requant_int instance serves both scans &#8212; same operation, sequential in the FSM.</text>
<text class="tsi" x="40" y="254" text-anchor="start">All neurons start on one pulse and share the activation mux, so no neuron can stall.</text>
<text class="ts" x="40" y="274" text-anchor="start">Counts shown for the 48&#8594;48 layer at NUM_FOLDS = 1, RQ_FOLDS = 4, AP_FOLDS = 8.</text>

</svg>
